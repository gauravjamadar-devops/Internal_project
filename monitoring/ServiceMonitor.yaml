apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fastapi-servicemonitor
  namespace: monitoring
  labels:
    release: monitoring          # REQUIRED: Prometheus serviceMonitorSelector matches this
    app: fastapi
spec:
  selector:
    matchLabels:
      app: fastapi
  namespaceSelector:
    matchNames:
      - dev
      - prod
  endpoints:
    - port: http                 # matches the port name in the Service
      path: /metrics
      interval: 30s
