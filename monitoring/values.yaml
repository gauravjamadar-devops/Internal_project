kube-prometheus-stack:
  alertmanager:
    config:
      global:
        resolve_timeout: 5m
        slack_api_url: 'https://hooks.slack.com/services/YOUR_WORKSPACE_ID/YOUR_BOT_ID/YOUR_WEBHOOK_TOKEN'

      inhibit_rules:
        - equal:
          - namespace
          - alertname
          source_matchers:
          - severity = critical
          target_matchers:
          - severity =~ warning|info
        - equal:
          - namespace
          - alertname
          source_matchers:
          - severity = warning
          target_matchers:
          - severity = info
        - equal:
          - namespace
          - alertname
          source_matchers:
          - alertname = InfoInhibitor
          target_matchers:
          - severity = info
        - target_matchers:
          - alertname = InfoInhibitor

      receivers:
        - name: "null"
        - name: slack
          slack_configs:
            - channel: '#alerts'
              send_resolved: true
              title: '{{ .CommonAnnotations.summary }}'
              text: '{{ .CommonAnnotations.description }}'
              username: 'Alertmanager'
              icon_emoji: ':rotating_light:'

      route:
        group_by:
          - namespace
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        receiver: slack
        routes:
          - matchers:
              - alertname = "Watchdog"
            receiver: "null"
