# AI Observability MCP Server Configuration
# Prometheus URL: use in-cluster DNS when deployed on Kubernetes,
#                 or localhost:9090 when port-forwarding locally.
prometheus:
  url: "http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090"
  # For local dev (kubectl port-forward svc/prometheus-operated 9090:9090 -n monitoring):
  # url: "http://localhost:9090"

alertmanager:
  url: "http://monitoring-kube-prometheus-alertmanager.monitoring.svc:9093"

# The incident-response MCP tools are restricted to dev by default.
namespaces:
  - dev

workloads:
  - fastapi-dev-deployment

workload_aliases:
  fastapi-dev-service: fastapi-dev-deployment

argocd:
  namespace: argocd
  applications:
    - fastapi-dev

application_services:
  dev:
    fastapi-dev-deployment: "http://fastapi-dev-service.dev.svc.cluster.local:8000"
