---
# ServiceAccount used by the MCP server pod
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-observability-sa
  namespace: dev
  labels:
    app: mcp-observability

---
# Read-only access to the application pods/events in dev.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-observability-reader
  namespace: dev
  labels:
    app: mcp-observability
rules:
  - apiGroups: [""]
    resources:
      - pods
      - events
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-observability-reader-binding
  namespace: dev
  labels:
    app: mcp-observability
subjects:
  - kind: ServiceAccount
    name: mcp-observability-sa
    namespace: dev
roleRef:
  kind: Role
  name: mcp-observability-reader
  apiGroup: rbac.authorization.k8s.io

---
# The same service account may inspect production pods/events, but cannot modify them.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-observability-reader
  namespace: prod
  labels:
    app: mcp-observability
rules:
  - apiGroups: [""]
    resources:
      - pods
      - events
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: mcp-observability-reader-binding
    namespace: prod
    labels:
      app: mcp-observability
subjects:
  - kind: ServiceAccount
    name: mcp-observability-sa
    namespace: dev
roleRef:
  kind: Role
  name: mcp-observability-reader
  apiGroup: rbac.authorization.k8s.io
