---
# ServiceAccount used by the MCP server pod
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-observability-sa
  namespace: dev
  labels:
    app: mcp-observability

---
# Read-only access to allowlisted dev workload state and logs.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-observability-reader
  namespace: dev
  labels:
    app: mcp-observability
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - events
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-observability-reader-binding
  namespace: dev
  labels:
    app: mcp-observability
subjects:
  - kind: ServiceAccount
    name: mcp-observability-sa
    namespace: dev
roleRef:
  kind: Role
  name: mcp-observability-reader
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-observability-workload-reader
  namespace: dev
  labels:
    app: mcp-observability
rules:
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-observability-workload-reader-binding
  namespace: dev
  labels:
    app: mcp-observability
subjects:
  - kind: ServiceAccount
    name: mcp-observability-sa
    namespace: dev
roleRef:
  kind: Role
  name: mcp-observability-workload-reader
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-observability-argocd-reader
  namespace: argocd
  labels:
    app: mcp-observability
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    resourceNames: ["fastapi-dev"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-observability-argocd-reader-binding
  namespace: argocd
  labels:
    app: mcp-observability
subjects:
  - kind: ServiceAccount
    name: mcp-observability-sa
    namespace: dev
roleRef:
  kind: Role
  name: mcp-observability-argocd-reader
  apiGroup: rbac.authorization.k8s.io
