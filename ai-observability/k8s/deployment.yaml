---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-observability
  namespace: dev
  labels:
    app: mcp-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-observability
  template:
    metadata:
      labels:
        app: mcp-observability
    spec:
      serviceAccountName: mcp-observability-sa
      containers:
        - name: mcp-server
          image: mcp-observability:latest
          imagePullPolicy: Never            # uses local Minikube image
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PROMETHEUS_URL
              value: "http://prometheus-operated.monitoring.svc.cluster.local:9090"
            - name: MCP_CONFIG_PATH
              value: "/app/config/config.yaml"
            - name: MCP_TRANSPORT
              value: "streamable-http"
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: MCP_PORT
              value: "8080"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: mcp-observability-service
  namespace: dev
  labels:
    app: mcp-observability
spec:
  selector:
    app: mcp-observability
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
