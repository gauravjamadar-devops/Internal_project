apiVersion: apps/v1
kind: Deployment
{{- if and .Values.incidentTestMode (ne .Release.Namespace "dev") }}
{{- fail "incidentTestMode is permitted only in the dev namespace" }}
{{- end }}
metadata:
  name: {{ .Release.Name }}-deployment
  labels:
    app: fastapi
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      containers:
      - name: fastapi
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- if .Values.incidentTestMode }}
        command:
          - python
          - -c
        args:
          - "raise SystemExit('controlled dev startup failure')"
        {{- end }}
        ports:
        - containerPort: {{ .Values.containerPort }}
        env:
        - name: FAIL_HEALTH
          value: {{ .Values.env.FAIL_HEALTH | quote }}
        - name: ENABLE_SIMULATE_ERROR
          value: {{ .Values.env.ENABLE_SIMULATE_ERROR | quote }}
        - name: APP_NAME
          valueFrom:
            configMapKeyRef:
              name: {{ .Release.Name }}-config
              key: APP_NAME
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: {{ .Release.Name }}-config
              key: ENVIRONMENT
        startupProbe:
          httpGet:
            path: /health
            port: {{ .Values.containerPort }}
          failureThreshold: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.containerPort }}
          initialDelaySeconds: 15
          timeoutSeconds: 10
          periodSeconds: 20
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.containerPort }}
          initialDelaySeconds: 10
          timeoutSeconds: 10
          periodSeconds: 10
          failureThreshold: 6
